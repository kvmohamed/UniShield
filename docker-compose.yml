# ============================================================
# UniShield - Docker Compose
# ============================================================
# Single service: the FastAPI backend, which also serves the dashboard at
# http://127.0.0.1:8000/dashboard (sign in there).
#
# There are no default accounts. Create the first administrator once:
#   docker compose run --rm api unishield-admin user create admin --role admin
# Automation uses service tokens (unishield-admin token create) or the
# static UNISHIELD_ADMIN_API_KEY from a .env file next to this file.
# For access from other machines put a TLS reverse proxy in front
# (deploy/nginx, deploy/caddy) and see docs/deployment.md.

services:
  api:
    build: .
    image: unishield:0.1.0
    container_name: unishield-api
    ports:
      - "127.0.0.1:8000:8000"           # published on the host's loopback only
    volumes:
      - ./configs:/app/configs:ro        # configuration
      - ./data:/app/data:ro              # replay inputs (read-only)
      - ./reports:/app/reports:ro        # benchmark / evaluation reports shown in the dashboard
      - ./models:/app/models:ro          # trained models for hybrid mode
      - unishield-state:/app/state       # alert database (SQLite)
      - unishield-exports:/app/exports   # JSON lines / CEF / STIX export files
      - unishield-logs:/app/logs
    environment:
      UNISHIELD_ENV: docker
      UNISHIELD_DEBUG: "false"
      UNISHIELD_DB_URL: sqlite:////app/state/unishield.db
      UNISHIELD_ADMIN_API_KEY: ${UNISHIELD_ADMIN_API_KEY:-}
      UNISHIELD_DETECTION_MODE: ${UNISHIELD_DETECTION_MODE:-rules}
      UNISHIELD_EXPORT_DIR: /app/exports
      UNISHIELD_EXPORT_CONTINUOUS: ${UNISHIELD_EXPORT_CONTINUOUS:-false}
      # Secret for analyst-side email, if configured (docs/deployment.md)
      UNISHIELD_SMTP_PASSWORD: ${UNISHIELD_SMTP_PASSWORD:-}
      UNISHIELD_ALERT_RETENTION_DAYS: ${UNISHIELD_ALERT_RETENTION_DAYS:-}
      UNISHIELD_API_DOCS: "false"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 45s               # graceful shutdown: open requests, then the running replay
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  unishield-state:
  unishield-exports:
  unishield-logs:
