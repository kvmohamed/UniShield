# ============================================================
# UniShield — Docker Compose
# ============================================================
# Single service: the FastAPI backend, which also serves the
# dashboard at http://127.0.0.1:8000/dashboard

services:
  api:
    build: .
    image: unishield:0.1.0
    container_name: unishield-api
    ports:
      # Loopback only: the API has no authentication yet (planned, Phase 8)
      - "127.0.0.1:8000:8000"
    volumes:
      # Read-only: the container never writes to host data or config
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
    environment:
      UNISHIELD_ENV: docker
      UNISHIELD_DEBUG: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
