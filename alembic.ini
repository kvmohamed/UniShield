# Alembic configuration for working on UniShield's schema in a source checkout.
# Operators use `unishield-admin db upgrade` instead; it needs no ini file.
#
#   alembic -c alembic.ini revision -m "describe the change"   # then edit the new file
#   alembic -c alembic.ini upgrade head
#
# The database URL comes from UNISHIELD_DB_URL / configs/config.yaml unless
# sqlalchemy.url is set below (see src/unishield/storage/migrations/env.py).

[alembic]
script_location = %(here)s/src/unishield/storage/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
