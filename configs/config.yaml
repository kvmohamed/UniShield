# ============================================================
# UniShield — Main Configuration
# ============================================================

app:
  name: "UniShield"
  version: "0.1.0"
  description: "AI Security for One-Way Networks"
  environment: "development"
  debug: true

security:
  # CRITICAL: Read-only mode. The system NEVER sends packets,
  # probes endpoints, decrypts payloads, or issues commands.
  read_only_mode: true
  no_payload_decryption: true
  no_active_scanning: true
  no_response_path: true
  anonymize_ips: false
  ip_hash_salt: "change-this-salt"

api:
  host: "127.0.0.1"
  port: 8000
  workers: 1
  reload: true

database:
  url: "sqlite+aiosqlite:///./data/unishield.db"
  echo: false
  pool_size: 5

processing:
  window_size_sec: 10
  slide_interval_sec: 5
  max_queue_size: 10000
  max_alert_batch: 100
  max_records_in_memory: 50000

ingest:
  supported_formats:
    - "pcap"
    - "pcapng"
    - "zeek_json"
    - "flow_csv"
    - "flow_json"
  max_file_size_mb: 500

models:
  default_version: "v1.0.0"
  saved_dir: "./models/saved"
  metadata_dir: "./models/metadata"

paths:
  data_dir: "./data"
  raw_dir: "./data/raw"
  processed_dir: "./data/processed"
  samples_dir: "./data/samples"
  config_dir: "./configs"
  reports_dir: "./reports"

dashboard:
  port: 8501
  theme: "dark"
