# ============================================================
# UniShield — Logging Configuration
# ============================================================

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S%z"
  json:
    class: "logging.Formatter"
    format: '{"timestamp":"%(asctime)s","level":"%(levelname)s","logger":"%(name)s","message":"%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%S%z"

handlers:
  console:
    class: "logging.StreamHandler"
    level: "INFO"
    formatter: "standard"
    stream: "ext://sys.stdout"
  file:
    class: "logging.handlers.RotatingFileHandler"
    level: "DEBUG"
    formatter: "json"
    filename: "logs/unishield.log"
    maxBytes: 10485760    # 10 MB
    backupCount: 5

loggers:
  unishield:
    level: "DEBUG"
    handlers: ["console", "file"]
    propagate: false
  unishield.ingest:
    level: "INFO"
    handlers: ["console", "file"]
    propagate: false
  unishield.detectors:
    level: "INFO"
    handlers: ["console", "file"]
    propagate: false
  unishield.api:
    level: "INFO"
    handlers: ["console", "file"]
    propagate: false
  uvicorn:
    level: "INFO"
    handlers: ["console"]
    propagate: false

root:
  level: "WARNING"
  handlers: ["console"]
