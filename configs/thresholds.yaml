# ============================================================
# UniShield — Detection Thresholds
# ============================================================
# All thresholds are configurable. These are starting defaults
# and must be tuned per-environment.
# Thresholds are NOT probabilities unless explicitly calibrated.

ddos:
  # Volumetric thresholds (per window)
  packets_per_second: 10000
  bytes_per_second: 50000000        # 50 MB/s
  syn_rate_threshold: 5000          # SYN packets per window
  syn_ack_imbalance_ratio: 5.0      # SYN/ACK ratio
  udp_flood_pps: 8000
  source_ip_entropy_low: 1.0        # Low entropy = single-source flood
  source_ip_entropy_high: 8.0       # High entropy = distributed attack
  destination_concentration: 0.8     # % of traffic to single dest
  unique_source_count: 500           # Unusual number of unique sources
  severity_levels:
    critical:
      packets_per_second: 50000
      bytes_per_second: 200000000
    high:
      packets_per_second: 20000
      bytes_per_second: 100000000
    medium:
      packets_per_second: 10000
      bytes_per_second: 50000000

scanning:
  # Port scan thresholds (per source per window)
  unique_dest_ports: 25
  unique_dest_hosts: 10
  connection_rate: 100               # connections per window
  failed_connection_ratio: 0.7       # ratio of failed connections
  fanout_score: 0.8                  # fan-out metric
  vertical_scan_ports: 50            # ports on single host
  horizontal_scan_hosts: 20          # hosts on single port
  burst_window_sec: 2
  burst_connections: 30
  severity_levels:
    critical:
      unique_dest_ports: 100
      unique_dest_hosts: 50
    high:
      unique_dest_ports: 50
      unique_dest_hosts: 25
    medium:
      unique_dest_ports: 25
      unique_dest_hosts: 10

beaconing:
  # C2 beacon thresholds
  min_connections: 10                # minimum connections to consider
  regularity_cv_threshold: 0.3      # coefficient of variation
  periodicity_score: 0.7            # FFT periodicity score
  destination_rarity: 0.9           # rarity percentile
  packet_size_regularity: 0.8       # size pattern score
  min_interval_sec: 5
  max_interval_sec: 3600
  severity_levels:
    critical:
      regularity_cv_threshold: 0.1
      periodicity_score: 0.9
    high:
      regularity_cv_threshold: 0.2
      periodicity_score: 0.8
    medium:
      regularity_cv_threshold: 0.3
      periodicity_score: 0.7

exfiltration:
  # Data exfiltration thresholds
  outbound_inbound_byte_ratio: 5.0
  long_session_duration_sec: 3600
  unusual_outbound_volume_mb: 100
  destination_rarity: 0.9
  burst_size_bytes: 10000000         # 10 MB burst
  port_rarity_threshold: 0.95
  baseline_deviation_sigma: 3.0
  severity_levels:
    critical:
      outbound_inbound_byte_ratio: 20.0
      unusual_outbound_volume_mb: 500
    high:
      outbound_inbound_byte_ratio: 10.0
      unusual_outbound_volume_mb: 200
    medium:
      outbound_inbound_byte_ratio: 5.0
      unusual_outbound_volume_mb: 100

dns:
  # DGA / DNS tunnelling thresholds (optional advanced module)
  query_length_threshold: 50
  domain_entropy_threshold: 3.5
  nxdomain_ratio: 0.3
  subdomain_uniqueness: 0.8
  txt_record_frequency: 0.1
  ngram_anomaly_score: 0.7

encrypted:
  # Encrypted session analysis thresholds (optional advanced module)
  # NOTE: These do NOT prove malware. They flag anomalous patterns.
  suspicious_tls_versions: ["SSLv3", "TLSv1.0"]
  flow_duration_threshold_sec: 60
  packet_size_variance_threshold: 0.1
  burst_pattern_score: 0.7

statistical:
  # General statistical anomaly thresholds
  z_score_threshold: 3.0
  mad_threshold: 3.5
  baseline_window_records: 1000
  min_samples_for_baseline: 50
