# ============================================================
# UniShield — Detection Thresholds
# ============================================================
# All thresholds are configurable. These are starting defaults
# and must be tuned per-environment.
# Thresholds are NOT probabilities unless explicitly calibrated.

ddos:
  # Evaluated per window for the most-targeted destination(s). "Peak" rates
  # are the busiest 1-second interval in the window, with each flow's packets
  # spread evenly over its duration (one long download is not a spike).
  packets_per_second: 10000          # volumetric: peak packets/s to one destination
  bytes_per_second: 50000000         # volumetric: peak bytes/s to one destination (400 Mbit/s)
  syn_rate_threshold: 1000           # SYN flood: peak half-open connection attempts/s to one destination
  syn_only_ratio: 0.8                # SYN flood: share of TCP attempts to it left half-open
  udp_flood_pps: 8000                # UDP flood: peak UDP packets/s to one destination
  udp_ratio: 0.7                     # UDP flood: share of its packets that are UDP
  min_unique_sources: 20             # sources needed to call an attack distributed (evidence)
  severity_levels:
    critical:
      packets_per_second: 50000
      syn_rate_threshold: 10000
    high:
      packets_per_second: 20000
      syn_rate_threshold: 3000
    medium:
      packets_per_second: 10000
      syn_rate_threshold: 1000

scanning:
  # Evaluated per source per window, on connection attempts only: flows the
  # source initiated (replies from service ports are ignored). An attempt has
  # failed when it was unanswered (S0) or rejected (REJ), or reset with no
  # data exchanged.
  unique_dest_ports: 25              # port scan: distinct ports on one host, or on any hosts with failures
  failed_connection_ratio: 0.5       # share of failed attempts that marks scanning
  horizontal_scan_hosts: 20          # host scan: distinct hosts probed on one port, with failures
  horizontal_scan_hosts_any: 50      # host scan: distinct hosts on one port, failures or not
  burst_window_sec: 2
  burst_connections: 30              # reconnaissance burst: attempts by one source in burst_window_sec, with failures
  severity_levels:
    critical:
      unique_dest_ports: 100
      unique_dest_hosts: 100
    high:
      unique_dest_ports: 50
      unique_dest_hosts: 50
    medium:
      unique_dest_ports: 25
      unique_dest_hosts: 20

beaconing:
  # Evaluated per (source, destination, port) over a rolling history of
  # connection start times kept across windows (beacons are slower than a window).
  min_connections: 10                # connections needed in the history
  min_interval_sec: 5                # ignore sub-5-second machine traffic (scans, floods, page loads)
  max_interval_sec: 3600
  regularity_cv_threshold: 0.3       # interval std / mean
  periodicity_score: 0.7             # share of intervals within 20% of the median
  max_destination_sources: 3         # rare destination: contacted by at most this many internal hosts
  history_sec: 7200                  # how long connection history is kept per pair
  realert_after_sec: 900             # re-report a pair after this much traffic time (or if severity rises)

exfiltration:
  # Evaluated per internal source -> external destination per window, on the
  # bytes the internal host uploaded on connections it initiated.
  min_upload_mb: 5                   # volume rule: upload to one destination in the window
  upload_download_ratio: 5.0         # every rule: upload must dominate download for the pair
  baseline_deviation_sigma: 3.5      # baseline rule: robust z of the source's window upload vs its history
  min_baseline_windows: 10           # history needed before the baseline rule applies
  baseline_min_upload_mb: 1          # baseline rule ignores smaller uploads
  long_session_duration_sec: 3600    # long-session rule: outbound session at least this long...
  long_session_min_upload_mb: 1      # ...that uploaded at least this much
  max_destination_sources: 3         # rare destination (<= this many internal uploaders) raises severity
  history_sec: 7200                  # destination rarity look-back
  realert_after_sec: 600             # re-report a pair after this much traffic time (or if severity rises)
  severity_levels:                   # volume rule, by MB uploaded in the window
    critical:
      upload_mb: 500
    high:
      upload_mb: 50
    medium:
      upload_mb: 5

dns:
  # DGA / DNS tunnelling thresholds (optional advanced module)
  query_length_threshold: 50
  domain_entropy_threshold: 3.5
  nxdomain_ratio: 0.3
  subdomain_uniqueness: 0.8
  txt_record_frequency: 0.1
  ngram_anomaly_score: 0.7

encrypted:
  # Encrypted session analysis thresholds (optional advanced module)
  # NOTE: These do NOT prove malware. They flag anomalous patterns.
  suspicious_tls_versions: ["SSLv3", "TLSv1.0"]
  flow_duration_threshold_sec: 60
  packet_size_variance_threshold: 0.1
  burst_pattern_score: 0.7

statistical:
  # Robust z-score detector: window metrics vs a rolling baseline of windows
  # that no rule explained (median / MAD).
  mad_threshold: 3.5                 # robust z needed per metric
  min_deviating_metrics: 2           # metrics that must deviate together
  min_samples_for_baseline: 30       # baseline windows before alerting
  baseline_windows: 120              # rolling baseline length

anomaly:
  # Isolation Forest over log-scaled window features; reports only windows
  # no rule explained, and trains only on such windows.
  min_training_windows: 100          # online warm-up when no saved model is loaded
  min_window_flows: 10               # skip windows too small for a meaningful profile
  quantile: 0.995                    # score must exceed this share of training windows...
  min_score: 0.6                     # ...and this absolute anomaly score (0.5 typical, 1 isolated)
  medium_score: 0.7                  # MEDIUM severity from this score
