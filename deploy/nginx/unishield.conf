# nginx in front of UniShield (see docs/deployment.md, "Reverse proxy").
# UniShield listens on 127.0.0.1:8000 with api.forwarded_allow_ips 127.0.0.1,
# so it trusts X-Forwarded-For/-Proto from this proxy only: client addresses
# in the audit log and the login rate limiter are the real ones, and the
# session cookie gets Secure and responses get HSTS because the request
# arrived over HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name unishield.example.internal;
    return 301 https://$host$request_uri;
}

server {
    # nginx >= 1.25.1 prefers "listen 443 ssl;" plus "http2 on;"
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name unishield.example.internal;

    ssl_certificate     /etc/unishield/tls/fullchain.pem;
    ssl_certificate_key /etc/unishield/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    # UniShield sets HSTS, CSP and the other security headers itself.
    client_max_body_size 1m;          # the API takes small JSON bodies only

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # replace, do not append client-sent values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;          # POST /replay/demo?wait=true blocks up to 120 s
    }
}
